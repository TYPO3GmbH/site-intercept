# Minimal nginx setup to test config/nginx/redirects.conf, used by run.sh
events {}

http {
    server {
        listen 80;
        # Keep relative redirect targets relative, so the Location header is compared as written in redirects.conf
        absolute_redirect off;

        include /etc/nginx/redirects.conf;

        # Every request that is not redirected is answered with 200
        location / {
            return 200 "OK\n";
        }
    }
}
