    return 303 /Home/ExtensionManuals.html#extension-manuals;
}
location = /typo3cms/Teams/Index.html {
    return 303 /Home/Teams.html;
}
location = /About.html {
    return 303 /Home/About.html;
}
location = /Contribute/Index.html {
