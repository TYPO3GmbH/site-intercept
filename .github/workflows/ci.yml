name: CI

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - 'legacy_hook/**'
  pull_request:
    paths-ignore:
      - 'legacy_hook/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run workflow setup
        uses: ./.github/actions/setup

      - name: Install dependencies (Composer)
        run: composer install --prefer-dist --no-progress --no-interaction --ansi
        env:
          COMPOSER_AUTH: '{
            "http-basic": {
              "repo.packagist.com": {
                "username": "token",
                "password": "${{ secrets.PACKAGIST_AUTH_TOKEN }}"
              }
            },
            "github-oauth": {
              "github.com": "${{ secrets.ACTIONS_TOKEN }}"
            }
          }'

      - name: PHP CGL
        run: composer t3g:cgl

      - name: phpstan
        run: composer t3g:phpstan

      - name: Install dependencies (npm)
        run: npm ci

      - name: Build frontend artifacts
        run: npm run build

      - name: Tests
        run: composer t3g:test:php:cover
        env:
          COMPOSER_PROCESS_TIMEOUT: 2400

  redirect_changes:
    name: 'Detect redirect changes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      redirects: ${{ steps.filter.outputs.redirects }}
      base: ${{ steps.filter.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changed redirect files
        id: filter
        env:
          # On pull requests: compare with the PR base. On push: compare with the commit before the push.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Empty or all-zero base (new branch) or unknown commit (force push): run the check to be safe
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "redirects=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE...HEAD" -- config/nginx/redirects.conf tests/Redirects; then
            echo "redirects=false" >> "$GITHUB_OUTPUT"
          else
            echo "redirects=true" >> "$GITHUB_OUTPUT"
            # The redirects job compares the redirects with this version
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  redirects:
    name: 'Redirects'
    needs: redirect_changes
    if: needs.redirect_changes.outputs.redirects == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The base version of redirects.conf is read from the git history
          fetch-depth: 0

      # Lint, nginx -t, every rule reachable and answered as written, diff against the base version
      # (job summary) and a live check of changed destinations on docs.typo3.org (warnings)
      - name: Verify nginx redirects
        env:
          BASE: ${{ needs.redirect_changes.outputs.base }}
        run: tests/Redirects/check.py --live-check ${BASE:+--base-ref "$BASE"}

  deployment:
    name: 'Deployment'
    needs: [build, redirect_changes, redirects]
    # The redirects job is skipped when redirects.conf did not change, a skipped job must not block the deployment
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.redirect_changes.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.redirects.result)
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
      && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        env:
          SSH_AUTH_SOCK: /tmp/ssh-auth.sock
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_rsa
          chmod 0600 ~/.ssh/deploy_rsa
          ssh-keygen -p -P "${{ secrets.SSH_PASSPHRASE }}" -N "" -f ~/.ssh/deploy_rsa
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add ~/.ssh/deploy_rsa

      - uses: actions/checkout@v7

      - name: Check out T3G GitHub actions
        uses: actions/checkout@v7
        with:
          repository: TYPO3GmbH/infra-github-actions
          ref: main
          # deploy.php includes the Deployer recipe from this checkout
          path: ./.github/actions/t3g

      - name: Run workflow setup
        uses: ./.github/actions/setup
        with:
          # Deployer 8 requires PHP 8.3, the build itself targets the platform PHP 8.2 of composer.json
          php-version: '8.3'

      - name: Install Deployer
        run: |
          composer install --working-dir=build/tools/deployer --no-progress --no-interaction --ansi
          build/tools/deployer/vendor/bin/dep --version

      - name: Deployment
        env:
          SSH_AUTH_SOCK: /tmp/ssh-auth.sock
          COMPOSER_AUTH: '{
              "http-basic": {
                "repo.packagist.com": {
                  "username": "token",
                  "password": "${{ secrets.PACKAGIST_AUTH_TOKEN }}"
                }
              },
              "github-oauth": {
                "github.com": "${{ secrets.ACTIONS_TOKEN }}"
              }
            }'
        run: |
          build/tools/deployer/vendor/bin/dep deploy ${{ github.ref_name }} -v --ansi

      - name: Create Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: typo3
          SENTRY_PROJECT: intercept
        run: |
          # Install Sentry CLI
          curl -sL https://sentry.io/get-cli/ | bash

          # Create new Sentry release
          export SENTRY_RELEASE=$(sentry-cli releases propose-version)
          sentry-cli --url https://sentry.typo3.com releases new -p $SENTRY_PROJECT $SENTRY_RELEASE
          sentry-cli --url https://sentry.typo3.com releases set-commits --auto $SENTRY_RELEASE
          sentry-cli --url https://sentry.typo3.com releases finalize $SENTRY_RELEASE

          # Create new deploy for this Sentry release
          sentry-cli --url https://sentry.typo3.com releases deploys $SENTRY_RELEASE new -e ${{ github.ref_name }}
