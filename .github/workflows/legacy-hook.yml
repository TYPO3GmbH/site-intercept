name: Legacy webhook

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'legacy_hook/**/*'
  pull_request:
    paths:
      - 'legacy_hook/**/*'
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run workflow setup
        uses: ./.github/actions/setup

      - name: Install dependencies (Composer)
        run: composer install --working-dir=./legacy_hook --prefer-dist --no-progress --no-interaction --ansi
        env:
          COMPOSER_AUTH: '{
            "http-basic": {
              "repo.packagist.com": {
                "username": "token",
                "password": "${{ secrets.PACKAGIST_AUTH_TOKEN }}"
              }
            },
            "github-oauth": {
              "github.com": "${{ secrets.ACTIONS_TOKEN }}"
            }
          }'
      - name: Tests
        run: composer --working-dir=./legacy_hook t3g:test

  deployment:
    name: 'Deployment'
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        env:
          SSH_AUTH_SOCK: /tmp/ssh-auth.sock
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_legacy_hook_rsa
          chmod 0600 ~/.ssh/deploy_legacy_hook_rsa
          ssh-keygen -p -P "${{ secrets.PROD_SSH_PASSPHRASE }}" -N "" -f ~/.ssh/deploy_legacy_hook_rsa
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add ~/.ssh/deploy_legacy_hook_rsa

      - uses: actions/checkout@v7

      - name: Run workflow setup
        uses: ./.github/actions/setup
        with:
          # Deployer 8 requires PHP 8.3
          php-version: '8.3'

      - name: Install Deployer
        run: |
          composer install --working-dir=build/tools/deployer --no-progress --no-interaction --ansi
          build/tools/deployer/vendor/bin/dep --version

      - name: Deployment
        env:
          SSH_AUTH_SOCK: /tmp/ssh-auth.sock
          COMPOSER_AUTH: '{
              "http-basic": {
                "repo.packagist.com": {
                  "username": "token",
                  "password": "${{ secrets.PACKAGIST_AUTH_TOKEN }}"
                }
              },
              "github-oauth": {
                "github.com": "${{ secrets.ACTIONS_TOKEN }}"
              }
            }'
        run: |
          build/tools/deployer/vendor/bin/dep deploy ${{ github.ref_name }} --file=legacy_hook/deploy.php -v --ansi
